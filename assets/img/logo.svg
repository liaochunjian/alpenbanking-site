<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" aria-hidden="true" focusable="false">
  <!--
    Aplen Baruch bank 品牌标识
    1) 圆角方形徽章：银行机构的稳定与信任感，红色渐变沿用网站主色调（浅红到深红）
    2) 八角星（两个交错方形，Rub el Hizb）：海湾与伊斯兰几何传统符号，
       两组方向的方形同时隐喻「传统金融 x 数字金融」的双向交织
    3) 金色内框与中心金珠：呼应巴林「珍珠之国」的采珠传统
  -->
  <defs>
    <linearGradient id="abGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D4142F"/>
      <stop offset="1" stop-color="#7E0919"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="11" fill="url(#abGrad)"/>

  <rect x="3.75" y="3.75" width="40.5" height="40.5" rx="8.5"
        fill="none" stroke="#C8A24A" stroke-opacity=".6" stroke-width="1"/>

  <g transform="translate(24 24)">
    <g fill="#FFFFFF" fill-opacity=".1" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round">
      <rect x="-9.6" y="-9.6" width="19.2" height="19.2"/>
      <rect x="-9.6" y="-9.6" width="19.2" height="19.2" transform="rotate(45)"/>
    </g>
    <circle cx="0" cy="0" r="2.7" fill="#C8A24A"/>
  </g>
</svg>
