# ---------------------------------------------------------------------------------------------
# Aplen Baruch static site - nginx server block
# Tested with nginx 1.20+ / 1.24+ (directives below are stable, no third-party modules required)
#
# Usage (Ubuntu / Debian):
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/alpen-bank.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Site root can be pointed straight at this repository (no build step needed).
# ---------------------------------------------------------------------------------------------

server {
    listen 80;
    listen [::]:80;

    # TODO: replace with your real domain(s)
    server_name _;

    # Site root: point this at the cloned repository directory.
    # Every asset path inside the HTML is relative, so it also works under a sub-directory.
    root /var/www/alpen-bank;
    index index.html;

    charset utf-8;
    default_type text/html;

    access_log /var/log/nginx/alpen-bank.access.log;
    error_log  /var/log/nginx/alpen-bank.error.log warn;

    # ------------------------------------------------------------ Pretty URLs and 404 handling
    # /personal      -> personal.html
    # /faq           -> faq.html
    # everything else -> 404.html (still returns HTTP 404)
    try_files $uri $uri.html $uri/ =404;

    error_page 404 /404.html;
    error_page 500 502 503 504 /404.html;

    location = /404.html {
        internal;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # NOTE: nginx only inherits add_header from the parent level when the child level defines
    # none of its own, so every location below repeats the security headers on purpose.
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        try_files $uri =404;
    }

    # HTML pages must not be cached aggressively (the language switcher re-reads the DOM).
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # ------------------------------------------------------------------------- Hardening rules
    # Never expose dotfiles (.git, .gitignore, .DS_Store ...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Never expose the build / QA helper scripts. Comment this out only if you move tools/ out
    # of the site root.
    location ^~ /tools/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ------------------------------------------------------------------------- Basic headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ------------------------------------------------------------------------- Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        application/xml
        application/xhtml+xml;

    client_max_body_size 1m;
    keepalive_timeout 65;
}

# ---------------------------------------------------------------------------------------------
# HTTPS (recommended). Terminate TLS with certbot certificates:
#
#   sudo certbot --nginx -d www.example.com
#
# or add this block manually after obtaining certificates, replacing the HTTP server above with
# a 301 redirect:
#
#   server {
#       listen 443 ssl http2;
#       server_name www.example.com;
#
#       ssl_certificate     /etc/letsencrypt/live/www.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/www.example.com/privkey.pem;
#       ssl_protocols       TLSv1.2 TLSv1.3;
#       ssl_session_cache   shared:SSL:10m;
#       ssl_session_timeout 1d;
#
#       add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#       # ... same root / try_files / location blocks as the HTTP server above ...
#   }
#
#   server {
#       listen 80;
#       server_name www.example.com;
#       return 301 https://$host$request_uri;
#   }
# ---------------------------------------------------------------------------------------------
